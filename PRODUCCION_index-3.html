<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo de Producción — La Sin Gluten</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#F6F5F2; --panel:#FFFFFF; --ink:#1E2321; --ink-soft:#5B635E;
    --line:#E4E1D9; --accent:#2F5D50; --accent-soft:#E7EFEC;
    --warn:#B4552F; --warn-soft:#FBEAE1; --mono:'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);}
  .wrap{max-width:1280px; margin:0 auto; padding:0 20px 80px;}

  .module-nav{background:var(--panel); border-bottom:1px solid var(--line); margin-bottom:28px; position:sticky; top:0; z-index:50;}
  .module-nav-inner{max-width:1280px; margin:0 auto; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  .module-title{font-size:15px; font-weight:700; letter-spacing:-0.01em;}
  .module-title .dim{color:var(--ink-soft); font-weight:500;}
  .module-tabs{display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px;}
  .module-tab{padding:8px 16px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); border:none; background:transparent;}
  .module-tab.active{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .progress{height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin:4px 0 14px;}
  .progress-bar{height:100%; background:var(--accent); transition:width .3s ease;}
  .stepper-dots{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .dot{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:1px solid var(--line); color:var(--ink-soft); background:#fff;}
  .dot.done{background:var(--accent); border-color:var(--accent); color:#fff;}
  .dot.current{border:2px solid var(--accent); color:var(--accent);}
  .paso-actual{border:1px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:26px 28px;}
  .paso-actual .paso-label{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent);}
  .paso-actual h3{font-size:22px; margin:6px 0 14px;}
  .paso-desc{font-size:15.5px; line-height:1.6; white-space:pre-wrap; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; min-height:90px;}
  .paso-actions{display:flex; justify-content:space-between; gap:12px; margin-top:20px; flex-wrap:wrap;}
  .btn-big{padding:14px 26px; font-size:15px;}
  .paso-actual.fin{text-align:center; background:#fff;}
  .resumen-pasos{list-style:none; padding:0; margin:16px auto 20px; max-width:420px; text-align:left; font-size:13px;}
  .resumen-pasos li{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line);}
  .section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:12px 14px 6px;}
  .en-curso{background:#FFF9EF; border-bottom:2px solid #E3B368;}
  .en-curso .recipe-item{border-bottom:1px solid #F0E2C6;}
  .en-curso .recipe-item.selected{background:#FBEBCB;}
  .pill.estado-en_curso{background:#FBEBCB; color:#8A5A12;}
  .pill.estado-finalizada{background:var(--accent-soft); color:var(--accent);}
  .pill.estado-cancelada{background:var(--warn-soft); color:var(--warn);}
  .dot-fin{font-size:13px;}
  textarea.obs{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; font-size:13.5px; resize:vertical; background:#fff;}
  .toolbar-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  input[type=date]{border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; font-size:13px; background:#fff; margin-left:4px;}
  .back-link{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; border-radius:20px; background:rgba(126,202,212,.15); border:1px solid rgba(126,202,212,.5); color:#3f8f99; text-decoration:none; white-space:nowrap;}

  header.top{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  h1{font-size:22px; margin:0 0 4px; letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft); font-size:13.5px; margin:0;}
  .btn{background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn:hover{opacity:.92;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn.small{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  input[type=text], input[type=number]{border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px; background:#fff; font-family:inherit;}
  input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink-soft);}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .seg{display:inline-flex; background:var(--bg); padding:3px; border-radius:8px; gap:2px;}
  .seg button{border:none; background:transparent; padding:6px 12px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .seg button.active{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:1px solid var(--line); background:#FAFAF7; white-space:nowrap;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
  .pill.line{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
  .muted{color:var(--ink-soft); font-size:12px;}
  .num{font-family:var(--mono); text-align:right; white-space:nowrap;}
  .big{font-weight:700;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:200;}
  .toast.show{opacity:1;}
  .empty{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  .layout{display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} }
  .list-panel{overflow:hidden;}
  .list-toolbar{padding:14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px;}
  .list-toolbar input[type=text]{width:100%;}
  .recipe-item{padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .recipe-item:last-child{border-bottom:none;}
  .recipe-item:hover{background:#FAFAF7;}
  .recipe-item.selected{background:var(--accent-soft);}
  .recipe-item .name{font-size:13.5px; font-weight:600;}
  .recipe-item .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .detail{padding:22px;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .detail-head h2{font-size:19px; margin:6px 0 4px;}
  .qty-box{background:#FAFAF7; border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
  .qty-box input{width:120px; font-family:var(--mono); font-size:15px; font-weight:700; text-align:right;}
  .summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:8px;}
  .card{background:#FAFAF7; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .card .label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px;}
  .card .value{font-family:var(--mono); font-size:20px; font-weight:700;}
  .card .foot{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .card.hl{background:var(--accent-soft); border-color:var(--accent);}
  .card.hl .value{color:var(--accent);}
  .group{margin-top:22px;}
  .group-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .notice{background:#FFF6E9; border:1px solid #E3B368; border-radius:10px; padding:11px 14px; font-size:12.5px; margin-bottom:14px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="error-banner" style="display:none; position:fixed; top:0; left:0; right:0; background:#B4552F; color:#fff; padding:14px 20px; font:13px -apple-system,sans-serif; z-index:9999; white-space:pre-wrap;"></div>
<script>
  function showErrorBanner(msg) {
    var el = document.getElementById('error-banner');
    el.textContent = 'Error: ' + msg + '  (F12 → Console para más detalle)';
    el.style.display = 'block';
  }
  window.addEventListener('error', function (e) { showErrorBanner(e.message); });
  window.addEventListener('unhandledrejection', function (e) { showErrorBanner(e.reason?.message || String(e.reason)); });
</script>

const MARCAS = [
  { value: "lasinglueten", label: "La Sin Gluten" },
  { value: "bocado", label: "Bocado" },
  { value: "rietmann", label: "Rietmann Ibérica" },
];
const marcaLabel = (v) => MARCAS.find(m => m.value === v)?.label || v;

// Mismas agrupaciones que el Módulo de Costos.
const GRUPOS = [
  { key: "materia_prima", label: "Materia prima", match: (c) => c === "materia_prima" },
  { key: "mano_obra", label: "Mano de obra", match: (c) => c === "mano_obra" },
  { key: "energia", label: "Energía / equipos", match: (c) => c === "energia" },
  { key: "packaging", label: "Packaging", match: (c) => c === "packaging" },
  { key: "otros", label: "Otros (logística, etc.)", match: (c) => c === "logistica" || c === "otro" || !c },
];

// IMPORTANTE: este módulo NO lee precios ni costos. Del insumo solo se piden
// los campos de cantidad/identificación.
const CAMPOS_INSUMO = "insumos(id, descripcion, categoria, unidad_base, presentacion, cantidad_presentacion, proveedor, cod_art)";

function fmt(n, dec = 2) {
  if (n === null || n === undefined || n === "" || Number.isNaN(Number(n))) return "—";
  return Number(n).toLocaleString("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: dec });
}

// Muestra una cantidad en su unidad más legible (g → kg, minutos → h).
function fmtCantidad(valor, unidad) {
  const v = Number(valor) || 0;
  if (unidad === "g") return v >= 1000 ? `${fmt(v / 1000, 3)} kg` : `${fmt(v, 1)} g`;
  if (unidad === "minuto") return fmtTiempo(v);
  if (unidad === "hora") return fmtTiempo(v * 60);
  if (unidad === "unidad") return `${fmt(v, 2)} u.`;
  if (unidad === "palet") return `${fmt(v, 2)} palets`;
  return `${fmt(v, 2)} ${unidad || ""}`.trim();
}

function fmtTiempo(min) {
  const total = Math.round(Number(min) || 0);
  if (total <= 0) return "0 min";
  const h = Math.floor(total / 60), m = total % 60;
  if (h > 0) return `${h} h${m > 0 ? ` ${m} min` : ""}`;
  return `${m} min`;
}

const aMinutos = (cant, unidad) => unidad === "hora" ? cant * 60 : (unidad === "minuto" ? cant : 0);

// Cantidad necesaria de un ingrediente para producir `lotes` lotes de la receta.
//  · Modo "lote": la cantidad cargada es el consumo de UN lote → escala directo.
//  · Modo "envase": la cantidad cargada son unidades de producto por envase → se
//    calculan los envases enteros necesarios (redondeo hacia arriba).
function necesidad(ri, lotes, factor) {
  const unidad = ri.insumos?.unidad_base || "";
  const porLote = Number(ri.cantidad_g) || 0;
  if (ri.modo_calculo === "envase") {
    const unidadesProd = (Number(factor) || 0) * lotes;
    const envases = porLote > 0 ? Math.ceil(unidadesProd / porLote) : 0;
    return { cantidad: envases, unidad: "envase", esEnvase: true, porLote: porLote, texto: `${fmt(envases, 0)} envases`, minutos: 0 };
  }
  const cantidad = porLote * lotes;
  return { cantidad, unidad, esEnvase: false, porLote, texto: fmtCantidad(cantidad, unidad), minutos: aMinutos(cantidad, unidad) };
}

// Equivalencia en presentaciones de compra (ej. "3 sacos de 25 kg"), solo cuando
// la presentación está expresada en kg y la unidad base es gramo.
function equivalenciaPresentacion(ri, calc) {
  const ins = ri.insumos;
  if (!ins || calc.esEnvase || ins.unidad_base !== "g") return null;
  const kgPres = Number(ins.cantidad_presentacion) || 0;
  if (kgPres <= 0 || calc.cantidad <= 0) return null;
  const n = calc.cantidad / (kgPres * 1000);
  return `${fmt(n, 2)} × ${ins.presentacion || `${fmt(kgPres)} kg`} (${Math.ceil(n)} entero${Math.ceil(n) === 1 ? "" : "s"})`;
}

function Toast({ message }) { return <div className={`toast ${message ? "show" : ""}`}>{message}</div>; }

/* ============================================================
   PDF — Orden de producción (solo cantidades)
   ============================================================ */
function generarPDFOrden({ receta, lotes, unidades, cajas, palets, grupos, horasHombre, minEquipos, pesoMasaG, responsable, notas }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const mx = 36; let y = 30;

  if (LOGO_BASE64) { try { doc.addImage(LOGO_BASE64, "PNG", mx, y, 32, 32); } catch (e) {} }
  const tx = LOGO_BASE64 ? mx + 42 : mx;
  doc.setFont("helvetica", "bold"); doc.setFontSize(12.5); doc.text("La Sin Gluten", tx, y + 13);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 95, 90);
  doc.text("Orden de producción", tx, y + 25);
  doc.text(`Fecha: ${new Date().toLocaleDateString("es-ES")}`, W - mx, y + 13, { align: "right" });
  doc.setTextColor(20, 20, 20);
  y += 40; doc.setDrawColor(228, 225, 217); doc.line(mx, y, W - mx, y); y += 18;

  doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text(receta.nombre, mx, y); y += 14;
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 95, 90);
  doc.text([marcaLabel(receta.marca), receta.codigo ? `Código ${receta.codigo}` : null, `1 lote = ${receta.factor_division} u.`].filter(Boolean).join("   ·   "), mx, y);
  doc.setTextColor(20, 20, 20); y += 12;

  const resumen = [
    ["Lotes a producir", fmt(lotes, 2)],
    ["Unidades", fmt(unidades, 0)],
  ];
  if (cajas !== null) resumen.push(["Cajas", fmt(cajas, 2)]);
  if (palets !== null) resumen.push(["Palets", fmt(palets, 2)]);
  if (pesoMasaG > 0) resumen.push(["Materia prima total", fmtCantidad(pesoMasaG, "g")]);
  if (horasHombre > 0) resumen.push(["Mano de obra", `${fmtTiempo(horasHombre)} (horas hombre)`]);
  if (minEquipos > 0) resumen.push(["Energía / equipos", fmtTiempo(minEquipos)]);
  doc.autoTable({ body: resumen, startY: y, margin: { left: mx, right: mx }, tableWidth: 300, theme: "plain",
    styles: { fontSize: 8.5, cellPadding: 3 }, columnStyles: { 0: { fontStyle: "bold", textColor: [91, 99, 94] }, 1: { halign: "right", fontStyle: "bold" } } });
  y = doc.lastAutoTable.finalY + 10;

  const body = [];
  grupos.forEach(g => {
    body.push([{ content: g.label, colSpan: 4, styles: { fillColor: [231, 239, 236], textColor: [47, 93, 80], fontStyle: "bold" } }]);
    g.items.forEach(ri => body.push([
      ri.insumos?.descripcion || "(insumo eliminado)",
      ri.__calc.esEnvase ? `${fmt(ri.__calc.porLote, 2)} u. prod./envase` : fmtCantidad(ri.__calc.porLote, ri.insumos?.unidad_base),
      ri.__calc.texto,
      "☐",
    ]));
  });
  doc.autoTable({ head: [["Insumo", "Por lote", `Total (${fmt(lotes, 2)} lotes)`, "OK"]], body, startY: y, margin: { left: mx, right: mx },
    styles: { fontSize: 8, cellPadding: 4, lineColor: [228, 225, 217], lineWidth: 0.5 },
    headStyles: { fillColor: [30, 35, 33], textColor: 255, fontStyle: "bold" },
    columnStyles: { 1: { halign: "right" }, 2: { halign: "right", fontStyle: "bold" }, 3: { halign: "center", cellWidth: 30 } } });
  y = doc.lastAutoTable.finalY + 18;

  if (notas) { doc.setFontSize(8.5); doc.setFont("helvetica", "bold"); doc.text("Notas", mx, y); y += 11; doc.setFont("helvetica", "normal");
    const lines = doc.splitTextToSize(notas, W - mx * 2); doc.text(lines, mx, y); y += lines.length * 11 + 8; }
  if (y > H - 80) { doc.addPage(); y = 50; }
  doc.setFontSize(8.5); doc.setFont("helvetica", "normal");
  doc.text(`Responsable: ${responsable || "______________________"}`, mx, y + 20);
  doc.text("Firma: ______________________", W / 2, y + 20);
  doc.setFontSize(8); doc.setTextColor(150, 150, 150);
  doc.text(`Generado el ${new Date().toLocaleString("es-ES")}`, mx, H - 24);

  const slug = (receta.codigo || receta.nombre).replace(/[^a-z0-9]+/gi, "_").toLowerCase();
  doc.save(`orden_produccion_${slug}_${new Date().toISOString().slice(0, 10)}.pdf`);
}

/* ============================================================
   PRODUCCIÓN REAL — helpers compartidos (crear, paso a paso, bitácora)
   ============================================================ */

// Nombre del usuario logueado (sesión del portal o del CRM), para registrar quién inicia/finaliza.
function usuarioActual() {
  for (const k of ["bauer_session", "crm_session"]) {
    try {
      const s = JSON.parse(localStorage.getItem(k) || "null");
      if (!s) continue;
      const u = s.user || s.usuario_obj || s;
      const nombre = u.nombre || u.name || u.usuario || u.username || u.email || s.nombre || s.usuario || s.email;
      if (nombre && typeof nombre === "string") return nombre;
    } catch (e) {}
  }
  return null;
}
function pedirUsuario(accion) {
  const u = usuarioActual();
  if (u) return u;
  const r = prompt(`¿Quién ${accion}? (tu nombre)`);
  return r && r.trim() ? r.trim() : null;
}

const fmtFechaHora = (iso) => iso ? new Date(iso).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const fmtHora = (iso) => iso ? new Date(iso).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) : "—";
const duracionMin = (a, b) => (a && b) ? Math.max(0, (new Date(b) - new Date(a)) / 60000) : null;
const ESTADOS = { en_curso: "En curso", finalizada: "Finalizada", cancelada: "Cancelada" };

// "Foto" de los recursos de la receta para N lotes. Solo cantidades, nunca precios.
function construirRecursos(ingredientes, lotes, factor) {
  const out = [];
  GRUPOS.forEach(g => {
    ingredientes.filter(ri => g.match(ri.insumos?.categoria)).forEach(ri => {
      const c = necesidad(ri, lotes, factor);
      out.push({
        grupo: g.key, grupo_label: g.label,
        descripcion: ri.insumos?.descripcion || "(insumo eliminado)",
        proveedor: ri.insumos?.proveedor || null,
        unidad: c.esEnvase ? "envase" : (ri.insumos?.unidad_base || ""),
        es_envase: c.esEnvase,
        por_lote: c.porLote,
        por_lote_texto: c.esEnvase ? `${fmt(c.porLote, 2)} u. prod./envase` : fmtCantidad(c.porLote, ri.insumos?.unidad_base),
        total: c.cantidad,
        total_texto: c.texto,
        minutos: c.minutos,
        equivale: equivalenciaPresentacion(ri, c),
      });
    });
  });
  return out;
}

function totalesRecursos(recursos) {
  const sum = (key, f) => (recursos || []).filter(r => r.grupo === key).reduce((s, r) => s + f(r), 0);
  return {
    horasHombreMin: sum("mano_obra", r => Number(r.minutos) || 0),
    equiposMin: sum("energia", r => Number(r.minutos) || 0),
    materiaPrimaG: sum("materia_prima", r => (!r.es_envase && r.unidad === "g") ? Number(r.total) || 0 : 0),
  };
}

// Índice del primer paso sin aceptar (= paso actual). Si todos están aceptados, devuelve pasos.length.
const indicePasoActual = (pasos) => { const i = (pasos || []).findIndex(p => !p.aceptado_at); return i === -1 ? (pasos || []).length : i; };

/* ============================================================
   PDF — Parte de producción (se puede regenerar desde la bitácora)
   ============================================================ */
function generarPDFProduccion(prod) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const mx = 36; let y = 30;

  if (LOGO_BASE64) { try { doc.addImage(LOGO_BASE64, "PNG", mx, y, 32, 32); } catch (e) {} }
  const tx = LOGO_BASE64 ? mx + 42 : mx;
  doc.setFont("helvetica", "bold"); doc.setFontSize(12.5); doc.text("La Sin Gluten", tx, y + 13);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 95, 90);
  doc.text("Parte de producción", tx, y + 25);
  doc.setFont("helvetica", "bold"); doc.setTextColor(20, 20, 20); doc.setFontSize(11);
  doc.text(prod.numero || `#${prod.id}`, W - mx, y + 13, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 95, 90);
  doc.text(ESTADOS[prod.estado] || prod.estado, W - mx, y + 25, { align: "right" });
  doc.setTextColor(20, 20, 20);
  y += 40; doc.setDrawColor(228, 225, 217); doc.line(mx, y, W - mx, y); y += 18;

  doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text(prod.receta_nombre, mx, y); y += 14;
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 95, 90);
  doc.text([marcaLabel(prod.marca), prod.receta_codigo ? `Código ${prod.receta_codigo}` : null, prod.factor_division ? `1 lote = ${fmt(prod.factor_division, 2)} u.` : null].filter(Boolean).join("   ·   "), mx, y);
  doc.setTextColor(20, 20, 20); y += 10;

  const uxc = Number(prod.unidades_por_caja) || 0, uxp = Number(prod.unidades_por_palet) || 0;
  const producidas = prod.unidades_producidas ?? prod.unidades_planificadas;
  const dif = Number(producidas) - Number(prod.unidades_planificadas);
  const dur = duracionMin(prod.inicio_at, prod.fin_at);
  const izq = [
    ["Lotes realizados", fmt(prod.lotes, 2)],
    ["Unidades planificadas", fmt(prod.unidades_planificadas, 0)],
    ["Unidades producidas", fmt(producidas, 0)],
    ["Diferencia", `${dif > 0 ? "+" : ""}${fmt(dif, 0)} u.${prod.unidades_planificadas > 0 ? ` (${fmt((dif / prod.unidades_planificadas) * 100, 1)} %)` : ""}`],
  ];
  if (uxc > 0) izq.push(["Cajas producidas", fmt(producidas / uxc, 2)]);
  if (uxp > 0) izq.push(["Palets", fmt(producidas / uxp, 2)]);
  const der = [
    ["Inicio", fmtFechaHora(prod.inicio_at)],
    ["Fin", fmtFechaHora(prod.fin_at)],
    ["Duración", dur !== null ? fmtTiempo(dur) : "—"],
    ["Iniciada por", prod.usuario_inicio || "—"],
    ["Finalizada por", prod.usuario_fin || "—"],
  ];
  const opts = { theme: "plain", styles: { fontSize: 8.5, cellPadding: 2.5 }, columnStyles: { 0: { fontStyle: "bold", textColor: [91, 99, 94] }, 1: { halign: "right", fontStyle: "bold" } } };
  const anchoCol = (W - mx * 2 - 20) / 2;
  doc.autoTable({ ...opts, body: izq, startY: y, margin: { left: mx }, tableWidth: anchoCol });
  const yIzq = doc.lastAutoTable.finalY;
  doc.autoTable({ ...opts, body: der, startY: y, margin: { left: mx + anchoCol + 20 }, tableWidth: anchoCol });
  y = Math.max(yIzq, doc.lastAutoTable.finalY) + 12;

  // Recursos utilizados
  const tot = totalesRecursos(prod.recursos);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.text("Recursos utilizados", mx, y); y += 6;
  const body = [];
  GRUPOS.forEach(g => {
    const items = (prod.recursos || []).filter(r => r.grupo === g.key);
    if (!items.length) return;
    let extra = "";
    if (g.key === "mano_obra" && tot.horasHombreMin > 0) extra = ` — total ${fmtTiempo(tot.horasHombreMin)} (horas hombre)`;
    if (g.key === "energia" && tot.equiposMin > 0) extra = ` — total ${fmtTiempo(tot.equiposMin)}`;
    if (g.key === "materia_prima" && tot.materiaPrimaG > 0) extra = ` — total ${fmtCantidad(tot.materiaPrimaG, "g")}`;
    body.push([{ content: g.label + extra, colSpan: 3, styles: { fillColor: [231, 239, 236], textColor: [47, 93, 80], fontStyle: "bold" } }]);
    items.forEach(r => body.push([r.descripcion, r.por_lote_texto, r.total_texto]));
  });
  doc.autoTable({ head: [["Recurso", "Por lote", `Total (${fmt(prod.lotes, 2)} lotes)`]], body, startY: y, margin: { left: mx, right: mx },
    styles: { fontSize: 8, cellPadding: 3.5, lineColor: [228, 225, 217], lineWidth: 0.5 },
    headStyles: { fillColor: [30, 35, 33], textColor: 255, fontStyle: "bold" },
    columnStyles: { 1: { halign: "right" }, 2: { halign: "right", fontStyle: "bold" } } });
  y = doc.lastAutoTable.finalY + 16;

  // Paso a paso realizado
  if ((prod.pasos || []).length > 0) {
    if (y > H - 120) { doc.addPage(); y = 50; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.text("Paso a paso realizado", mx, y); y += 6;
    doc.autoTable({ head: [["#", "Paso", "Aceptado", "Por"]],
      body: prod.pasos.map((p, i) => [i + 1, p.titulo || `Paso ${i + 1}`, p.aceptado_at ? fmtFechaHora(p.aceptado_at) : "—", p.aceptado_por || "—"]),
      startY: y, margin: { left: mx, right: mx },
      styles: { fontSize: 8, cellPadding: 3.5, lineColor: [228, 225, 217], lineWidth: 0.5 },
      headStyles: { fillColor: [30, 35, 33], textColor: 255, fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 24, halign: "center" }, 2: { cellWidth: 110 }, 3: { cellWidth: 110 } } });
    y = doc.lastAutoTable.finalY + 16;
  }

  const textoLibre = (titulo, texto) => {
    if (!texto) return;
    if (y > H - 90) { doc.addPage(); y = 50; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.text(titulo, mx, y); y += 12;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
    const lines = doc.splitTextToSize(texto, W - mx * 2); doc.text(lines, mx, y); y += lines.length * 11 + 8;
  };
  textoLibre("Observaciones", prod.observaciones);
  textoLibre("Motivo de cancelación", prod.motivo_cancelacion);

  if (y > H - 70) { doc.addPage(); y = 50; }
  doc.setFontSize(8.5); doc.setFont("helvetica", "normal");
  doc.text("Firma responsable: ______________________", mx, y + 24);
  doc.text("Firma control: ______________________", W / 2, y + 24);

  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(150, 150, 150);
    doc.text(`${prod.numero || ""} · generado el ${new Date().toLocaleString("es-ES")}`, mx, H - 22);
    doc.text(`Página ${i} de ${pages}`, W - mx, H - 22, { align: "right" });
  }
  doc.save(`parte_produccion_${prod.numero || prod.id}.pdf`);
}

/* ============================================================
   VISTA: PRODUCCIÓN — crear producción y seguir el paso a paso
   ============================================================ */
function ProduccionView({ notify, onCambio }) {
  const [recetas, setRecetas] = useState(null);
  const [conteo, setConteo] = useState({});
  const [enCurso, setEnCurso] = useState([]);
  const [search, setSearch] = useState("");
  const [marcaTab, setMarcaTab] = useState("todas");
  const [selectedId, setSelectedId] = useState(null);
  const [ingredientes, setIngredientes] = useState(null);
  const [pasosReceta, setPasosReceta] = useState(null);
  const [lotesInput, setLotesInput] = useState("1");
  const [activa, setActiva] = useState(null);      // producción abierta en pantalla
  const [guardando, setGuardando] = useState(false);
  const [unidadesReales, setUnidadesReales] = useState("");
  const [observaciones, setObservaciones] = useState("");

  const loadEnCurso = useCallback(async () => {
    const { data, error } = await supabase.from("producciones").select("*").eq("estado", "en_curso").order("inicio_at", { ascending: false });
    if (error) { notify("Error al cargar producciones: " + error.message); return; }
    setEnCurso(data || []);
  }, [notify]);

  useEffect(() => {
    (async () => {
      const { data, error } = await supabase.from("receta_produccion")
        .select("id, marca, codigo, nombre, factor_division, unidades_por_caja, unidades_por_palet, aprobada")
        .eq("activo", true).eq("aprobada", true).order("nombre");
      if (error) { notify("Error al cargar recetas: " + error.message); setRecetas([]); return; }
      setRecetas(data || []);
      const { data: ps } = await supabase.from("receta_pasos").select("receta_produccion_id");
      const c = {}; (ps || []).forEach(p => { c[p.receta_produccion_id] = (c[p.receta_produccion_id] || 0) + 1; });
      setConteo(c);
    })();
    loadEnCurso();
  }, [notify, loadEnCurso]);

  // Al elegir receta: ingredientes (solo cantidades) y paso a paso.
  useEffect(() => {
    if (!selectedId) { setIngredientes(null); setPasosReceta(null); return; }
    let cancelado = false;
    (async () => {
      setIngredientes(null); setPasosReceta(null);
      const [ing, ps] = await Promise.all([
        supabase.from("receta_produccion_ingredientes").select(`id, cantidad_g, modo_calculo, orden, ${CAMPOS_INSUMO}`)
          .eq("receta_produccion_id", selectedId).order("orden", { ascending: true }),
        supabase.from("receta_pasos").select("id, orden, titulo, descripcion")
          .eq("receta_produccion_id", selectedId).order("orden", { ascending: true }).order("id", { ascending: true }),
      ]);
      if (cancelado) return;
      if (ing.error) notify("Error al cargar ingredientes: " + ing.error.message);
      if (ps.error) notify("Error al cargar el paso a paso: " + ps.error.message);
      setIngredientes(ing.data || []);
      setPasosReceta(ps.data || []);
    })();
    return () => { cancelado = true; };
  }, [selectedId, notify]);

  const filtered = useMemo(() => {
    if (!recetas) return [];
    const q = search.trim().toLowerCase();
    return recetas.filter(r => (marcaTab === "todas" || r.marca === marcaTab) &&
      (!q || r.nombre.toLowerCase().includes(q) || (r.codigo || "").toLowerCase().includes(q)));
  }, [recetas, search, marcaTab]);

  const selected = recetas?.find(r => r.id === selectedId) || null;
  const factor = Number(selected?.factor_division) || 0;
  const lotes = Math.max(0, Number(String(lotesInput).replace(",", ".")) || 0);
  const unidadesPlan = lotes * factor;
  const recursosPreview = useMemo(() => (ingredientes && lotes > 0) ? construirRecursos(ingredientes, lotes, factor) : [], [ingredientes, lotes, factor]);
  const totPreview = totalesRecursos(recursosPreview);

  const elegirReceta = (id) => { setActiva(null); setSelectedId(id); setLotesInput("1"); };
  const abrirProduccion = (p) => { setActiva(p); setSelectedId(null); setUnidadesReales(String(Math.round(Number(p.unidades_planificadas) || 0))); setObservaciones(p.observaciones || ""); };

  const crearProduccion = async () => {
    if (!selected || lotes <= 0 || !ingredientes) return;
    if (ingredientes.length === 0) { notify("La receta no tiene ingredientes cargados"); return; }
    const pasosTxt = pasosReceta && pasosReceta.length ? `${pasosReceta.length} pasos` : "sin paso a paso cargado";
    if (!confirm(`¿Crear producción de "${selected.nombre}"?\n\n${fmt(lotes, 2)} lotes · ${fmt(unidadesPlan, 0)} unidades · ${pasosTxt}\n\nSe registra ahora la fecha y hora de inicio.`)) return;
    const usuario = pedirUsuario("inicia la producción");
    if (!usuario) return;
    setGuardando(true);
    const { data, error } = await supabase.from("producciones").insert({
      receta_produccion_id: selected.id,
      receta_nombre: selected.nombre,
      receta_codigo: selected.codigo || null,
      marca: selected.marca,
      factor_division: factor,
      unidades_por_caja: selected.unidades_por_caja || null,
      unidades_por_palet: selected.unidades_por_palet || null,
      lotes,
      unidades_planificadas: unidadesPlan,
      estado: "en_curso",
      inicio_at: new Date().toISOString(),
      usuario_inicio: usuario,
      recursos: construirRecursos(ingredientes, lotes, factor),
      pasos: (pasosReceta || []).map(p => ({ orden: p.orden, titulo: p.titulo, descripcion: p.descripcion, aceptado_at: null, aceptado_por: null })),
    }).select().single();
    setGuardando(false);
    if (error) { notify("No se pudo crear la producción: " + error.message); return; }
    notify(`Producción ${data.numero} creada — inicio ${fmtHora(data.inicio_at)}`);
    abrirProduccion(data);
    loadEnCurso();
    onCambio();
  };

  // Guarda el paso a paso en la base cada vez que se acepta o se vuelve atrás (no se pierde al recargar).
  const guardarPasos = async (nuevosPasos) => {
    setGuardando(true);
    const { data, error } = await supabase.from("producciones").update({ pasos: nuevosPasos }).eq("id", activa.id).select().single();
    setGuardando(false);
    if (error) { notify("No se pudo guardar el paso: " + error.message); return; }
    setActiva(data);
    setEnCurso(prev => prev.map(x => x.id === data.id ? data : x));
  };

  const aceptarPaso = () => {
    const i = indicePasoActual(activa.pasos);
    if (i >= activa.pasos.length) return;
    const n = activa.pasos.map((p, k) => k === i ? { ...p, aceptado_at: new Date().toISOString(), aceptado_por: usuarioActual() } : p);
    guardarPasos(n);
  };
  const volverPaso = () => {
    const i = indicePasoActual(activa.pasos);
    if (i === 0) return;
    const n = activa.pasos.map((p, k) => k === i - 1 ? { ...p, aceptado_at: null, aceptado_por: null } : p);
    guardarPasos(n);
  };

  const finalizar = async () => {
    const reales = Number(String(unidadesReales).replace(",", "."));
    if (!(reales >= 0) || unidadesReales === "") { notify("Indicá cuántas unidades se produjeron"); return; }
    const usuario = pedirUsuario("finaliza la producción");
    if (!usuario) return;
    setGuardando(true);
    const { data, error } = await supabase.from("producciones").update({
      estado: "finalizada", fin_at: new Date().toISOString(), usuario_fin: usuario,
      unidades_producidas: reales, observaciones: observaciones.trim() || null,
    }).eq("id", activa.id).select().single();
    setGuardando(false);
    if (error) { notify("No se pudo finalizar: " + error.message); return; }
    generarPDFProduccion(data);
    notify(`Producción ${data.numero} finalizada y guardada en la bitácora`);
    setActiva(data);
    loadEnCurso();
    onCambio();
  };

  const cancelar = async () => {
    const motivo = prompt(`¿Cancelar la producción ${activa.numero}?\n\nEscribí el motivo (queda en la bitácora):`);
    if (motivo === null) return;
    if (!motivo.trim()) { notify("Hace falta indicar el motivo"); return; }
    const usuario = pedirUsuario("cancela la producción");
    if (!usuario) return;
    setGuardando(true);
    const { data, error } = await supabase.from("producciones").update({
      estado: "cancelada", fin_at: new Date().toISOString(), usuario_fin: usuario, motivo_cancelacion: motivo.trim(),
    }).eq("id", activa.id).select().single();
    setGuardando(false);
    if (error) { notify("No se pudo cancelar: " + error.message); return; }
    notify(`Producción ${data.numero} cancelada`);
    setActiva(data);
    loadEnCurso();
    onCambio();
  };

  // ---------- Render del panel derecho ----------
  const renderActiva = () => {
    const p = activa;
    const pasos = p.pasos || [];
    const total = pasos.length;
    const idx = indicePasoActual(pasos);
    const pasosListos = idx >= total;
    const paso = !pasosListos ? pasos[idx] : null;
    const cerrada = p.estado !== "en_curso";
    const tot = totalesRecursos(p.recursos);
    const uxc = Number(p.unidades_por_caja) || 0;

    return (
      <div className="panel detail">
        <div className="detail-head">
          <div>
            <span className="pill">{marcaLabel(p.marca)}</span>{" "}
            <span className={`pill estado-${p.estado}`}>{ESTADOS[p.estado]}</span>
            <h2>{p.receta_nombre}</h2>
            <div className="muted">
              <strong>{p.numero}</strong> · {fmt(p.lotes, 2)} lotes · {fmt(p.unidades_planificadas, 0)} u. planificadas
              {uxc > 0 ? ` (${fmt(p.unidades_planificadas / uxc, 2)} cajas)` : ""}
              {" · "}inicio {fmtFechaHora(p.inicio_at)}{p.usuario_inicio ? ` por ${p.usuario_inicio}` : ""}
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "flex-end" }}>
            {cerrada && <button className="btn small" onClick={() => generarPDFProduccion(p)}>Descargar PDF</button>}
            {!cerrada && <button className="btn ghost small" onClick={cancelar} disabled={guardando}>Cancelar producción</button>}
            <button className="btn ghost small" onClick={() => setActiva(null)}>Cerrar</button>
          </div>
        </div>

        <div className="summary" style={{ marginBottom: 16 }}>
          <div className="card"><div className="label">Lotes</div><div className="value">{fmt(p.lotes, 2)}</div></div>
          <div className="card hl"><div className="label">Unidades</div><div className="value">{fmt(p.unidades_planificadas, 0)}</div></div>
          {tot.materiaPrimaG > 0 && <div className="card"><div className="label">Materia prima</div><div className="value">{fmtCantidad(tot.materiaPrimaG, "g")}</div></div>}
          <div className="card"><div className="label">Horas hombre</div><div className="value">{fmtTiempo(tot.horasHombreMin)}</div></div>
        </div>

        {cerrada ? (
          <div className="paso-actual fin">
            <div style={{ fontSize: 36 }}>{p.estado === "finalizada" ? "✓" : "✕"}</div>
            <h3>Producción {p.estado === "finalizada" ? "finalizada" : "cancelada"}</h3>
            <p className="muted" style={{ fontSize: 13 }}>
              {fmtFechaHora(p.inicio_at)} → {fmtFechaHora(p.fin_at)} · duración {fmtTiempo(duracionMin(p.inicio_at, p.fin_at))}
              {p.estado === "finalizada" ? ` · ${fmt(p.unidades_producidas, 0)} u. producidas` : ""}
            </p>
            {p.motivo_cancelacion && <p className="muted">Motivo: {p.motivo_cancelacion}</p>}
            <p className="muted">Quedó registrada en la bitácora.</p>
          </div>
        ) : (
          <React.Fragment>
            {total > 0 && (
              <React.Fragment>
                <div className="progress"><div className="progress-bar" style={{ width: `${(Math.min(idx, total) / total) * 100}%` }} /></div>
                <div className="stepper-dots">
                  {pasos.map((ps, i) => (
                    <span key={i} className={`dot ${ps.aceptado_at ? "done" : ""} ${i === idx ? "current" : ""}`}
                      title={`${ps.titulo || `Paso ${i + 1}`}${ps.aceptado_at ? ` — ${fmtHora(ps.aceptado_at)}` : ""}`}>{ps.aceptado_at ? "✓" : i + 1}</span>
                  ))}
                  <span className={`dot dot-fin ${pasosListos ? "current" : ""}`} title="Finalizar">⚑</span>
                </div>
              </React.Fragment>
            )}

            {paso && (
              <div className="paso-actual">
                <div className="paso-label">Paso {idx + 1} de {total}</div>
                <h3>{paso.titulo || `Paso ${idx + 1}`}</h3>
                <div className="paso-desc">{paso.descripcion || <span className="muted">(sin descripción)</span>}</div>
                <div className="paso-actions">
                  <button className="btn ghost" onClick={volverPaso} disabled={idx === 0 || guardando}>← Paso anterior</button>
                  <button className="btn btn-big" onClick={aceptarPaso} disabled={guardando}>
                    {guardando ? "Guardando…" : idx < total - 1 ? "✓ Aceptar y continuar" : "✓ Aceptar último paso"}
                  </button>
                </div>
              </div>
            )}

            {pasosListos && (
              <div className="paso-actual">
                <div className="paso-label">{total > 0 ? "Paso a paso completado" : "Esta receta no tiene paso a paso cargado"}</div>
                <h3>Finalizar producción</h3>
                <div style={{ display: "grid", gridTemplateColumns: "220px 1fr", gap: 14, alignItems: "start" }}>
                  <div>
                    <div className="hint" style={{ marginBottom: 4 }}>Unidades producidas</div>
                    <input type="number" min="0" step="1" value={unidadesReales} onChange={(e) => setUnidadesReales(e.target.value)}
                      style={{ width: "100%", fontFamily: "var(--mono)", fontSize: 16, fontWeight: 700, textAlign: "right" }} />
                    <div className="hint">Planificadas: {fmt(p.unidades_planificadas, 0)}
                      {unidadesReales !== "" && Number(unidadesReales) !== Number(p.unidades_planificadas) &&
                        <> · diferencia <strong>{fmt(Number(unidadesReales) - Number(p.unidades_planificadas), 0)}</strong></>}
                    </div>
                  </div>
                  <div>
                    <div className="hint" style={{ marginBottom: 4 }}>Observaciones (opcional)</div>
                    <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={3}
                      placeholder="Mermas, incidencias, lote de materia prima usado…" className="obs" />
                  </div>
                </div>
                <div className="paso-actions">
                  <button className="btn ghost" onClick={volverPaso} disabled={total === 0 || guardando}>← Paso anterior</button>
                  <button className="btn btn-big" onClick={finalizar} disabled={guardando}>{guardando ? "Guardando…" : "Finalizar producción y generar PDF"}</button>
                </div>
              </div>
            )}
          </React.Fragment>
        )}

        <details style={{ marginTop: 20 }}>
          <summary className="muted" style={{ cursor: "pointer", fontSize: 12.5 }}>Ver recursos de esta producción ({(p.recursos || []).length})</summary>
          <TablaRecursos recursos={p.recursos} />
        </details>
      </div>
    );
  };

  const renderNueva = () => (
    <div className="panel detail">
      <div className="detail-head">
        <div>
          <span className="pill">{marcaLabel(selected.marca)}</span>
          <h2>{selected.nombre}</h2>
          <div className="muted">{selected.codigo ? `${selected.codigo} · ` : ""}1 lote = {selected.factor_division} u.{pasosReceta ? ` · ${pasosReceta.length} pasos` : ""}</div>
        </div>
      </div>

      <div className="qty-box">
        <span style={{ fontWeight: 600, fontSize: 13 }}>Lotes a realizar</span>
        <input type="number" min="0" step="1" value={lotesInput} onChange={(e) => setLotesInput(e.target.value)} />
        <span className="muted">= {fmt(unidadesPlan, 0)} unidades{Number(selected.unidades_por_caja) > 0 ? ` · ${fmt(unidadesPlan / selected.unidades_por_caja, 2)} cajas` : ""}</span>
        <button className="btn btn-big" style={{ marginLeft: "auto" }} onClick={crearProduccion}
          disabled={guardando || lotes <= 0 || !ingredientes || !pasosReceta}>
          {guardando ? "Creando…" : "▶ Crear producción"}
        </button>
      </div>

      {pasosReceta && pasosReceta.length === 0 && (
        <div className="notice">Esta receta no tiene paso a paso cargado (se carga en Módulo de Costos → Paso a paso). Igual podés crear la producción y finalizarla directamente.</div>
      )}

      {lotes > 0 && (
        <div className="summary">
          {totPreview.materiaPrimaG > 0 && <div className="card"><div className="label">Materia prima</div><div className="value">{fmtCantidad(totPreview.materiaPrimaG, "g")}</div></div>}
          <div className="card hl"><div className="label">Horas hombre</div><div className="value">{fmtTiempo(totPreview.horasHombreMin)}</div></div>
          {totPreview.equiposMin > 0 && <div className="card"><div className="label">Energía / equipos</div><div className="value">{fmtTiempo(totPreview.equiposMin)}</div></div>}
        </div>
      )}
      {ingredientes === null && <div className="empty">Cargando…</div>}
      {ingredientes && lotes > 0 && <TablaRecursos recursos={recursosPreview} />}
    </div>
  );

  return (
    <React.Fragment>
      <header className="top">
        <div>
          <h1>Producción</h1>
          <p className="sub">Elegí una receta aprobada, indicá los lotes y pulsá "Crear producción": se registra el inicio y se activa el paso a paso.</p>
        </div>
      </header>

      <div className="layout">
        <div className="panel list-panel">
          {enCurso.length > 0 && (
            <div className="en-curso">
              <div className="section-label">En curso ({enCurso.length})</div>
              {enCurso.map(p => {
                const i = indicePasoActual(p.pasos), t = (p.pasos || []).length;
                return (
                  <div key={p.id} className={`recipe-item ${activa?.id === p.id ? "selected" : ""}`} onClick={() => abrirProduccion(p)}>
                    <div className="name">▶ {p.receta_nombre}</div>
                    <div className="meta">{p.numero} · {fmt(p.lotes, 2)} lotes · desde {fmtFechaHora(p.inicio_at)} · {t > 0 ? `paso ${Math.min(i + 1, t)}/${t}` : "sin pasos"}</div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="list-toolbar">
            <div className="section-label" style={{ padding: 0 }}>Nueva producción</div>
            <input type="text" placeholder="Buscar receta o código…" value={search} onChange={(e) => setSearch(e.target.value)} />
            <div className="tabs">
              <div className={`tab ${marcaTab === "todas" ? "active" : ""}`} onClick={() => setMarcaTab("todas")}>Todas</div>
              {MARCAS.map(m => <div key={m.value} className={`tab ${marcaTab === m.value ? "active" : ""}`} onClick={() => setMarcaTab(m.value)}>{m.label}</div>)}
            </div>
          </div>
          {recetas === null && <div className="empty">Cargando…</div>}
          {recetas !== null && recetas.length === 0 && <div className="empty">No hay recetas aprobadas.</div>}
          {filtered.map(r => (
            <div key={r.id} className={`recipe-item ${r.id === selectedId && !activa ? "selected" : ""}`} onClick={() => elegirReceta(r.id)}>
              <div className="name">🔒 {r.nombre}</div>
              <div className="meta">{r.codigo ? `${r.codigo} · ` : ""}{marcaLabel(r.marca)} · {conteo[r.id] ? `${conteo[r.id]} paso${conteo[r.id] === 1 ? "" : "s"}` : "sin paso a paso"}</div>
            </div>
          ))}
        </div>

        {activa ? renderActiva()
          : selected ? renderNueva()
          : <div className="panel"><div className="empty">Elegí una receta para crear una producción{enCurso.length ? ", o retomá una en curso" : ""}.</div></div>}
      </div>
    </React.Fragment>
  );
}

function TablaRecursos({ recursos }) {
  const grupos = GRUPOS.map(g => ({ ...g, items: (recursos || []).filter(r => r.grupo === g.key) })).filter(g => g.items.length);
  return grupos.map(g => (
    <div key={g.key} className="group">
      <div className="group-head"><span className="pill line">{g.label}</span></div>
      <table>
        <thead><tr><th>Recurso</th><th className="num">Por lote</th><th className="num">Total</th>{g.key === "materia_prima" && <th>Equivale a</th>}</tr></thead>
        <tbody>
          {g.items.map((r, i) => (
            <tr key={i}>
              <td>{r.descripcion}</td>
              <td className="num muted">{r.por_lote_texto}</td>
              <td className="num big">{r.total_texto}</td>
              {g.key === "materia_prima" && <td className="muted">{r.equivale || "—"}</td>}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  ));
}

/* ============================================================
   VISTA: BITÁCORA — historial de producciones
   ============================================================ */
function BitacoraView({ notify, refreshKey }) {
  const [rows, setRows] = useState(null);
  const [estado, setEstado] = useState("todas");
  const [q, setQ] = useState("");
  const [desde, setDesde] = useState("");
  const [hasta, setHasta] = useState("");

  const load = useCallback(async () => {
    let query = supabase.from("producciones").select("*").order("inicio_at", { ascending: false }).limit(1000);
    if (desde) query = query.gte("inicio_at", new Date(desde + "T00:00:00").toISOString());
    if (hasta) query = query.lte("inicio_at", new Date(hasta + "T23:59:59").toISOString());
    const { data, error } = await query;
    if (error) { notify("Error al cargar la bitácora: " + error.message); setRows([]); return; }
    setRows(data || []);
  }, [notify, desde, hasta]);
  useEffect(() => { load(); }, [load, refreshKey]);

  const visibles = useMemo(() => {
    if (!rows) return [];
    const s = q.trim().toLowerCase();
    return rows.filter(r => (estado === "todas" || r.estado === estado) &&
      (!s || r.receta_nombre.toLowerCase().includes(s) || (r.receta_codigo || "").toLowerCase().includes(s) || (r.numero || "").toLowerCase().includes(s)));
  }, [rows, estado, q]);

  const totalUnidades = visibles.filter(r => r.estado === "finalizada").reduce((s, r) => s + (Number(r.unidades_producidas) || 0), 0);

  return (
    <React.Fragment>
      <header className="top">
        <div>
          <h1>Bitácora de producción</h1>
          <p className="sub">Todas las producciones registradas, con su parte en PDF.</p>
        </div>
        <button className="btn ghost small" onClick={load}>Actualizar</button>
      </header>

      <div className="toolbar-row">
        <input type="text" placeholder="Buscar nº, producto o código…" value={q} onChange={(e) => setQ(e.target.value)} style={{ minWidth: 240 }} />
        <div className="tabs">
          {["todas", "en_curso", "finalizada", "cancelada"].map(e => (
            <div key={e} className={`tab ${estado === e ? "active" : ""}`} onClick={() => setEstado(e)}>{e === "todas" ? "Todas" : ESTADOS[e]}</div>
          ))}
        </div>
        <label className="muted">Desde <input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></label>
        <label className="muted">Hasta <input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></label>
        <span className="muted" style={{ marginLeft: "auto" }}>{visibles.length} producciones · {fmt(totalUnidades, 0)} u. producidas</span>
      </div>

      <div className="panel" style={{ overflowX: "auto" }}>
        {rows === null && <div className="empty">Cargando…</div>}
        {rows && visibles.length === 0 && <div className="empty">No hay producciones con ese filtro.</div>}
        {visibles.length > 0 && (
          <table style={{ minWidth: 1050 }}>
            <thead><tr>
              <th>Nº</th><th>Producto</th><th className="num">Lotes</th><th className="num">Planif.</th><th className="num">Producidas</th>
              <th>Inicio</th><th>Fin</th><th className="num">Duración</th><th>Estado</th><th>Responsable</th><th></th>
            </tr></thead>
            <tbody>
              {visibles.map(r => {
                const dur = duracionMin(r.inicio_at, r.fin_at);
                return (
                  <tr key={r.id}>
                    <td style={{ fontFamily: "var(--mono)", whiteSpace: "nowrap" }}>{r.numero}</td>
                    <td>{r.receta_nombre}<div className="muted">{r.receta_codigo ? `${r.receta_codigo} · ` : ""}{marcaLabel(r.marca)}</div></td>
                    <td className="num">{fmt(r.lotes, 2)}</td>
                    <td className="num muted">{fmt(r.unidades_planificadas, 0)}</td>
                    <td className="num big">{r.unidades_producidas !== null ? fmt(r.unidades_producidas, 0) : "—"}</td>
                    <td style={{ whiteSpace: "nowrap" }}>{fmtFechaHora(r.inicio_at)}</td>
                    <td style={{ whiteSpace: "nowrap" }}>{fmtFechaHora(r.fin_at)}</td>
                    <td className="num">{dur !== null ? fmtTiempo(dur) : "—"}</td>
                    <td><span className={`pill estado-${r.estado}`}>{ESTADOS[r.estado]}</span></td>
                    <td className="muted">{r.usuario_fin || r.usuario_inicio || "—"}</td>
                    <td>{r.estado !== "en_curso" && <button className="btn ghost small" onClick={() => generarPDFProduccion(r)}>PDF</button>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </React.Fragment>
  );
}

/* ============================================================
   VISTA: PLANIFICACIÓN (cantidades)
   ============================================================ */
function PlanificacionView({ notify }) {
  const [recetas, setRecetas] = useState(null);
  const [search, setSearch] = useState("");
  const [marcaTab, setMarcaTab] = useState("todas");
  const [selectedId, setSelectedId] = useState(null);
  const [ingredientes, setIngredientes] = useState(null);
  const [modo, setModo] = useState("lotes"); // lotes | unidades | cajas
  const [valor, setValor] = useState("1");
  const [responsable, setResponsable] = useState("");
  const [notas, setNotas] = useState("");

  // Solo recetas APROBADAS en el Módulo de Costos. Sin campos de costo.
  const loadRecetas = useCallback(async () => {
    const { data, error } = await supabase.from("receta_produccion")
      .select("id, marca, codigo, nombre, descripcion, factor_division, unidades_por_caja, unidades_por_palet, aprobada, aprobada_at, aprobada_por")
      .eq("activo", true).eq("aprobada", true).order("nombre");
    if (error) { notify("Error al cargar recetas: " + error.message); setRecetas([]); return; }
    setRecetas(data || []);
  }, [notify]);
  useEffect(() => { loadRecetas(); }, [loadRecetas]);

  const selected = recetas?.find(r => r.id === selectedId) || null;

  useEffect(() => {
    if (!selectedId) { setIngredientes(null); return; }
    let cancelado = false;
    (async () => {
      setIngredientes(null);
      const { data, error } = await supabase.from("receta_produccion_ingredientes")
        .select(`id, cantidad_g, modo_calculo, orden, ${CAMPOS_INSUMO}`)
        .eq("receta_produccion_id", selectedId).order("orden", { ascending: true });
      if (cancelado) return;
      if (error) { notify("Error al cargar ingredientes: " + error.message); setIngredientes([]); return; }
      setIngredientes(data || []);
    })();
    return () => { cancelado = true; };
  }, [selectedId, notify]);

  const filtered = useMemo(() => {
    if (!recetas) return [];
    const q = search.trim().toLowerCase();
    return recetas.filter(r => (marcaTab === "todas" || r.marca === marcaTab) &&
      (!q || r.nombre.toLowerCase().includes(q) || (r.codigo || "").toLowerCase().includes(q)));
  }, [recetas, search, marcaTab]);

  const factor = Number(selected?.factor_division) || 0;
  const uxc = Number(selected?.unidades_por_caja) || 0;
  const uxp = Number(selected?.unidades_por_palet) || 0;
  const v = Math.max(0, Number(String(valor).replace(",", ".")) || 0);

  // Todo se lleva a "lotes" para calcular.
  const lotes = !selected || factor <= 0 ? 0
    : modo === "lotes" ? v
    : modo === "unidades" ? v / factor
    : uxc > 0 ? (v * uxc) / factor : 0;
  const unidades = lotes * factor;
  const cajas = uxc > 0 ? unidades / uxc : null;
  const palets = uxp > 0 ? unidades / uxp : null;

  const grupos = useMemo(() => {
    if (!ingredientes) return [];
    return GRUPOS.map(g => ({
      ...g,
      items: ingredientes.filter(ri => g.match(ri.insumos?.categoria)).map(ri => ({ ...ri, __calc: necesidad(ri, lotes, factor) })),
    })).filter(g => g.items.length > 0);
  }, [ingredientes, lotes, factor]);

  const minDe = (key) => (grupos.find(g => g.key === key)?.items || []).reduce((s, ri) => s + ri.__calc.minutos, 0);
  const horasHombre = minDe("mano_obra");
  const minEquipos = minDe("energia");
  const pesoMasaG = (grupos.find(g => g.key === "materia_prima")?.items || [])
    .filter(ri => ri.insumos?.unidad_base === "g" && !ri.__calc.esEnvase).reduce((s, ri) => s + ri.__calc.cantidad, 0);

  const onSelect = (id) => { setSelectedId(id); setModo("lotes"); setValor("1"); };

  const lotesNoEnteros = lotes > 0 && Math.abs(lotes - Math.round(lotes)) > 1e-9;

  return (
    <React.Fragment>
        <header className="top">
          <div>
            <h1>Planificación de producción</h1>
            <p className="sub">Elegí una receta aprobada e indicá cuánto querés producir: calcula ingredientes, horas hombre y materiales necesarios.</p>
          </div>
        </header>

        <div className="layout">
          <div className="panel list-panel">
            <div className="list-toolbar">
              <input type="text" placeholder="Buscar receta o código…" value={search} onChange={(e) => setSearch(e.target.value)} />
              <div className="tabs">
                <div className={`tab ${marcaTab === "todas" ? "active" : ""}`} onClick={() => setMarcaTab("todas")}>Todas</div>
                {MARCAS.map(m => <div key={m.value} className={`tab ${marcaTab === m.value ? "active" : ""}`} onClick={() => setMarcaTab(m.value)}>{m.label}</div>)}
              </div>
            </div>
            {recetas === null && <div className="empty">Cargando…</div>}
            {recetas !== null && recetas.length === 0 && (
              <div className="empty">No hay recetas aprobadas.<br /><span className="muted">Aprobalas en el Módulo de Costos → Recetas con el botón "RECETA APROBADA".</span></div>
            )}
            {recetas !== null && recetas.length > 0 && filtered.length === 0 && <div className="empty">Ninguna receta coincide.</div>}
            {filtered.map(r => (
              <div key={r.id} className={`recipe-item ${r.id === selectedId ? "selected" : ""}`} onClick={() => onSelect(r.id)}>
                <div className="name">🔒 {r.nombre}</div>
                <div className="meta">{r.codigo ? `${r.codigo} · ` : ""}{marcaLabel(r.marca)} · 1 lote = {r.factor_division} u.</div>
              </div>
            ))}
          </div>

          {!selected ? (
            <div className="panel"><div className="empty">Elegí una receta aprobada de la lista.</div></div>
          ) : (
            <div className="panel detail">
              <div className="detail-head">
                <div>
                  <span className="pill">{marcaLabel(selected.marca)}</span>
                  <h2>{selected.nombre}</h2>
                  <div className="muted">
                    {selected.codigo ? `${selected.codigo} · ` : ""}1 lote = {selected.factor_division} u.
                    {uxc > 0 ? ` · ${uxc} u./caja` : ""}{uxp > 0 ? ` · ${uxp} u./palet` : ""}
                    {selected.aprobada_at ? ` · aprobada el ${new Date(selected.aprobada_at).toLocaleDateString("es-ES")}${selected.aprobada_por ? ` por ${selected.aprobada_por}` : ""}` : ""}
                  </div>
                </div>
                <button className="btn small" disabled={!ingredientes || ingredientes.length === 0 || lotes <= 0}
                  onClick={() => generarPDFOrden({ receta: selected, lotes, unidades, cajas, palets, grupos, horasHombre, minEquipos, pesoMasaG, responsable, notas })}>
                  Descargar orden de producción (PDF)
                </button>
              </div>

              <div className="qty-box">
                <span style={{ fontWeight: 600, fontSize: 13 }}>Cantidad a producir</span>
                <input type="number" min="0" step="any" value={valor} onChange={(e) => setValor(e.target.value)} />
                <div className="seg">
                  <button className={modo === "lotes" ? "active" : ""} onClick={() => setModo("lotes")}>lotes</button>
                  <button className={modo === "unidades" ? "active" : ""} onClick={() => setModo("unidades")}>unidades</button>
                  <button className={modo === "cajas" ? "active" : ""} disabled={uxc <= 0} title={uxc <= 0 ? "La receta no tiene unidades por caja" : ""} onClick={() => setModo("cajas")}>cajas</button>
                </div>
              </div>

              {lotesNoEnteros && (
                <div className="notice">
                  Equivale a <strong>{fmt(lotes, 3)} lotes</strong> (no es un número entero). Para hacer lotes completos: {Math.floor(lotes) > 0 && <>{Math.floor(lotes)} lotes = {fmt(Math.floor(lotes) * factor, 0)} u. · </>}{Math.ceil(lotes)} lotes = {fmt(Math.ceil(lotes) * factor, 0)} u.{" "}
                  <button className="btn ghost small" onClick={() => { setModo("lotes"); setValor(String(Math.ceil(lotes))); }}>Usar {Math.ceil(lotes)} lotes</button>
                </div>
              )}

              <div className="summary">
                <div className="card"><div className="label">Lotes</div><div className="value">{fmt(lotes, 2)}</div></div>
                <div className="card hl"><div className="label">Unidades</div><div className="value">{fmt(unidades, 0)}</div></div>
                {cajas !== null && <div className="card"><div className="label">Cajas</div><div className="value">{fmt(cajas, 2)}</div></div>}
                {palets !== null && <div className="card"><div className="label">Palets</div><div className="value">{fmt(palets, 2)}</div></div>}
                {pesoMasaG > 0 && <div className="card"><div className="label">Materia prima total</div><div className="value">{fmtCantidad(pesoMasaG, "g")}</div></div>}
                <div className="card hl"><div className="label">Horas hombre</div><div className="value">{fmtTiempo(horasHombre)}</div><div className="foot">{fmt(horasHombre / 60, 2)} h</div></div>
                {minEquipos > 0 && <div className="card"><div className="label">Energía / equipos</div><div className="value">{fmtTiempo(minEquipos)}</div></div>}
              </div>

              {ingredientes === null && <div className="empty">Cargando ingredientes…</div>}
              {ingredientes && ingredientes.length === 0 && <div className="empty">Esta receta no tiene ingredientes cargados.</div>}
              {ingredientes && ingredientes.length > 0 && lotes <= 0 && <div className="empty">Ingresá una cantidad mayor a cero.</div>}
              {ingredientes && ingredientes.length > 0 && lotes > 0 && grupos.map(g => (
                <div key={g.key} className="group">
                  <div className="group-head"><span className="pill line">{g.label}</span></div>
                  <table>
                    <thead><tr>
                      <th>Insumo</th><th>Proveedor</th><th className="num">Por lote</th><th className="num">Total necesario</th>
                      {g.key === "materia_prima" && <th>Equivale a</th>}
                    </tr></thead>
                    <tbody>
                      {g.items.map(ri => (
                        <tr key={ri.id}>
                          <td>{ri.insumos?.descripcion || "(insumo eliminado)"}</td>
                          <td className="muted">{ri.insumos?.proveedor || "—"}</td>
                          <td className="num muted">{ri.__calc.esEnvase ? `${fmt(ri.__calc.porLote, 2)} u./envase` : fmtCantidad(ri.__calc.porLote, ri.insumos?.unidad_base)}</td>
                          <td className="num big">{ri.__calc.texto}</td>
                          {g.key === "materia_prima" && <td className="muted">{equivalenciaPresentacion(ri, ri.__calc) || "—"}</td>}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))}

              {ingredientes && ingredientes.length > 0 && lotes > 0 && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 12, marginTop: 24 }}>
                  <div><div className="hint" style={{ marginBottom: 4 }}>Responsable (para el PDF)</div>
                    <input type="text" value={responsable} onChange={(e) => setResponsable(e.target.value)} placeholder="opcional" style={{ width: "100%" }} /></div>
                  <div><div className="hint" style={{ marginBottom: 4 }}>Notas (para el PDF)</div>
                    <input type="text" value={notas} onChange={(e) => setNotas(e.target.value)} placeholder="opcional" style={{ width: "100%" }} /></div>
                </div>
              )}
            </div>
          )}
        </div>
    </React.Fragment>
  );
}

/* ============================================================
   APP RAÍZ — pestañas del módulo
   ============================================================ */
function ProduccionApp() {
  const [vista, setVista] = useState("produccion");
  const [refreshKey, setRefreshKey] = useState(0);
  const onCambio = useCallback(() => setRefreshKey(k => k + 1), []);
  const [toast, setToast] = useState("");
  const notify = useCallback((m) => { setToast(m); setTimeout(() => setToast(""), 2600); }, []);
  return (
    <React.Fragment>
      <nav className="module-nav">
        <div className="module-nav-inner">
          <div className="module-title">Módulo de Producción <span className="dim">· La Sin Gluten</span></div>
          <div className="module-tabs">
            <button className={`module-tab ${vista === "planificacion" ? "active" : ""}`} onClick={() => setVista("planificacion")}>Planificación</button>
            <button className={`module-tab ${vista === "produccion" ? "active" : ""}`} onClick={() => setVista("produccion")}>Producción</button>
            <button className={`module-tab ${vista === "bitacora" ? "active" : ""}`} onClick={() => setVista("bitacora")}>Bitácora</button>
          </div>
          <a className="back-link" href={HUB_URL}>← Módulo de Gestión</a>
        </div>
      </nav>
      <div className="wrap">
        {/* Las vistas quedan montadas para no perder lo que se estaba haciendo al cambiar de pestaña */}
        <div style={{ display: vista === "planificacion" ? "block" : "none" }}><PlanificacionView notify={notify} /></div>
        <div style={{ display: vista === "produccion" ? "block" : "none" }}><ProduccionView notify={notify} onCambio={onCambio} /></div>
        <div style={{ display: vista === "bitacora" ? "block" : "none" }}><BitacoraView notify={notify} refreshKey={refreshKey} /></div>
      </div>
      <Toast message={toast} />
    </React.Fragment>
  );
}

// ---- Acceso: requiere sesión del hub La Sin Gluten (o del portal / CRM) ----
function AccessGate() {
  const [estado, setEstado] = useState("cargando");
  useEffect(() => {
    (async () => {
      let tieneHub = false;
      try { const { data } = await supabase.auth.getSession(); tieneHub = !!(data && data.session); } catch (e) {}
      if (!tieneHub && !SESSION_TOKEN) { setEstado("sin_sesion"); return; }
      try {
        const { data } = await supabase.rpc("sesion_diagnostico");
        if (data && data.valida === false && (data.recibe_token || tieneHub)) { setEstado("caducada"); return; }
      } catch (e) {}
      setEstado("ok");
    })();
  }, []);
  if (estado === "ok") return <ProduccionApp />;
  if (estado === "cargando") return <div style={{ padding: 60, textAlign: "center", color: "#888", fontFamily: "sans-serif" }}>Verificando sesión…</div>;
  return (
    <div style={{ maxWidth: 440, margin: "100px auto", textAlign: "center", fontFamily: "sans-serif", padding: 24 }}>
      <p style={{ fontSize: 15, marginBottom: 16 }}>
        {estado === "caducada" ? "Tu sesión ha caducado. Volvé a iniciar sesión." : "No hay una sesión activa. Iniciá sesión desde el Módulo de Gestión de La Sin Gluten."}
      </p>
      <a href={HUB_URL} style={{ color: "#2f7a4f", textDecoration: "underline" }}>Ir al Módulo de Gestión</a>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AccessGate />);
</script>
